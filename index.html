<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CAKRA-SAINS VR - Ekosistem Pembelajaran Imersif</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { eco: { 400: '#34d399', 500: '#10b981', 600: '#059669' } },
                    animation: {
                        'floatSlow': 'floatSlow 6s ease-in-out infinite',
                    }
                }
            }
        }
    </script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Three.js & VR Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/effects/StereoEffect.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DeviceOrientationControls.js"></script>

    <style>
        body { 
            background: #000000; color: #f8fafc; overflow: hidden; margin: 0; padding: 0; touch-action: none;
            -webkit-user-select: none; user-select: none;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* --- STYLING LENSA CARDBOARD --- */
        .vr-lens-container {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background-color: #000; padding: 10px;
        }
        .vr-lens-mask {
            width: 100%; height: 100%; border-radius: 35%; overflow: hidden; position: relative; background: #111; box-shadow: inset 0 0 50px rgba(0,0,0,1); transform: scale(1.05);
        }
        .vr-video { width: 100%; height: 100%; object-fit: cover; }
        .normal-video { width: 100%; height: 100%; object-fit: contain; }

        /* Latar Belakang Animasi Landing Page */
        .neon-bg {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 0; overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #064e3b 0%, #020617 70%);
        }
        .blob {
            position: absolute; filter: blur(80px); opacity: 0.4; animation: float 10s infinite ease-in-out alternate;
        }
        
        .float-icon {
            position: absolute; opacity: 0.15; filter: drop-shadow(0 0 12px rgba(52,211,153,0.9));
            animation: floatSlow 15s infinite linear alternate;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-20px) scale(1.1); }
        }
        @keyframes floatSlow {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-20px) rotate(1deg); }
        }

        /* Animasi Sembunyi Otomatis untuk Fullscreen */
        .auto-hide-ui {
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }
        .ui-hidden {
            opacity: 0 !important;
            pointer-events: none !important;
            transform: translateY(20px);
        }

        /* CSS Fallback Fullscreen (Untuk iOS Safari) */
        body.fallback-fullscreen #root > div {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw; min-height: 100dvh; height: 100dvh;
            z-index: 999999; background: black; overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // PENTING: ID Sinyal Siaran di tabel Supabase
        const BROADCAST_SIGNAL_ID = 1; 

        // --- ICONS ---
        const IconFilm = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>;
        const IconVR = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.52 7.15L15 4V3a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v18a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-1l6.52-3.15a1 1 0 0 0 .48-.9V8.05a1 1 0 0 0-.48-.9z"></path><path d="M15 12v.01"></path><path d="M15 8v.01"></path><path d="M15 16v.01"></path></svg>;
        const IconTrash = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;
        const IconVolumeUp = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>;
        const IconVolumeOff = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="1" x2="1" y2="23"></line></svg>;
        const IconFullscreen = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>;
        const IconEyeOpen = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>;
        const IconEyeClosed = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>;
        const IconStop = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>;
        const IconSettings = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;
        
        // --- ICONS EKOSISTEM ---
        const EcoEarth = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>;
        const EcoLeaf = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><line x1="2" y1="22" x2="11" y2="20"/></svg>;
        const EcoSunCloud = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="20" y1="5" x2="22" y2="6"/></svg>;
        const EcoBird = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10z"/><path d="M9 10h.01M15 10h.01"/></svg>;
        const EcoFox = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><polygon points="12 22 2 10 12 2 22 10 12 22"/><path d="M2 10l10 5 10-5"/></svg>;

        const SUPABASE_URL = "https://xltrmoeabasrconlhijv.supabase.co";
        const SUPABASE_KEY = "sb_publishable_kzMgSC5JniUeJZGBGW1RIA_7aKyk0vh";
        const STORAGE_BUCKET = "videos";

        const supabaseApi = async (endpoint, options = {}) => {
            const res = await fetch(`${SUPABASE_URL}/rest/v1${endpoint}`, {
                ...options,
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=representation',
                    ...(options.headers || {})
                }
            });
            if (!res.ok) throw new Error(`API Error: ${res.status}`);
            return res.status === 204 ? null : await res.json();
        };

        const CAKRA_SCENES = {
          scene_space: { id: 'scene_space', title: 'Tata Surya & Eksplorasi Luar Angkasa', environment: 'stars', hotspots: [] }
        };

        function CakraSainsApp() {
            const [currentView, setCurrentView] = useState('landing');
            const [vrMode, setVrMode] = useState(false);
            const [gyroRequested, setGyroRequested] = useState(false);
            const [isMuted, setIsMuted] = useState(true);
            const [broadcastData, setBroadcastData] = useState(null);
            const [activeBroadcastId, setActiveBroadcastId] = useState(null); 
            const pollingInterval = useRef(null);

            // Fungsi Polling untuk Siswa
            const pollBroadcastState = useCallback(async () => {
                if (currentView !== 'waiting' && currentView !== 'player') return;
                try {
                    const data = await supabaseApi(`/films?id=eq.${BROADCAST_SIGNAL_ID}&select=*`);
                    const signalMedia = data && data[0];

                    if (signalMedia) {
                        const isBroadcasting = signalMedia.url && signalMedia.url.trim() !== '';
                        if (isBroadcasting) {
                            const actualMediaId = signalMedia.format; 
                            if (actualMediaId !== activeBroadcastId) {
                                setActiveBroadcastId(actualMediaId);
                                const payload = { type: 'video', data: signalMedia };
                                setBroadcastData(payload);
                                if (currentView === 'waiting') {
                                    setVrMode(true);
                                    setCurrentView('player');
                                }
                            }
                        } else if (activeBroadcastId !== null) {
                            setActiveBroadcastId(null);
                            setBroadcastData(null);
                            if (currentView === 'player') {
                                setVrMode(false);
                                setCurrentView('waiting');
                            }
                        }
                    }
                } catch (error) {
                    console.warn("Polling Error:", error.message);
                }
            }, [currentView, activeBroadcastId]);

            useEffect(() => {
                if (currentView === 'waiting' || currentView === 'player') {
                    pollingInterval.current = setInterval(pollBroadcastState, 3000);
                    pollBroadcastState();
                } else {
                    if (pollingInterval.current) clearInterval(pollingInterval.current);
                }
                return () => { if (pollingInterval.current) clearInterval(pollingInterval.current); };
            }, [currentView, pollBroadcastState]);

            // Listener untuk sinkronisasi antar-tab di perangkat Guru yang sama
            useEffect(() => {
                const handleStorageChange = (e) => {
                    if (e.key === 'cakra_broadcast' && e.newValue) {
                        const payload = JSON.parse(e.newValue);
                        if (payload.type === 'stop') {
                            setBroadcastData(null);
                            setActiveBroadcastId(null);
                        } else {
                            setBroadcastData(payload);
                            setActiveBroadcastId(payload.data.id || payload.data.format);
                        }
                    }
                };
                window.addEventListener('storage', handleStorageChange);
                return () => window.removeEventListener('storage', handleStorageChange);
            }, []);

            // Fungsi Hentikan/Mulai Siaran (Guru)
            const handleTeacherBroadcastAction = async (media, isStopSignal = false) => {
                try {
                    if (isStopSignal) {
                        await supabaseApi(`/films?id=eq.${BROADCAST_SIGNAL_ID}`, {
                            method: 'PATCH',
                            body: JSON.stringify({ title: 'SIARAN DIHENTIKAN', url: '', format: null, is_video: false })
                        });
                        setActiveBroadcastId(null);
                        setBroadcastData(null);
                    } else {
                        await supabaseApi(`/films?id=eq.${BROADCAST_SIGNAL_ID}`, {
                            method: 'PATCH',
                            body: JSON.stringify({ title: media.title, url: media.url, format: media.id.toString(), is_video: media.is_video })
                        });
                        setActiveBroadcastId(media.id.toString());
                        const payload = { type: 'video', data: media };
                        setBroadcastData(payload);
                    }
                    
                    const payload = isStopSignal ? { type: 'stop', timestamp: Date.now() } : { type: 'video', data: media, timestamp: Date.now() };
                    localStorage.setItem('cakra_broadcast', JSON.stringify(payload));
                    window.dispatchEvent(new StorageEvent('storage', { key: 'cakra_broadcast', newValue: JSON.stringify(payload) }));
                } catch (error) {
                    console.error("Gagal melakukan aksi siaran:", error);
                }
            };

            return (
                <div className="w-full h-[100dvh] min-h-[100dvh] text-white font-sans overflow-hidden selection:bg-cyan-500/30 bg-[#000000]">
                    {currentView === 'landing' && <LandingScreen onEnterStudent={() => setCurrentView('waiting')} onEnterTeacher={() => setCurrentView('teacher_auth')} />}
                    {currentView === 'waiting' && <StudentWaitingRoom onEnterVR={() => { setVrMode(true); setCurrentView('player'); }} onExit={() => setCurrentView('landing')} />}
                    {currentView === 'player' && (
                        <VRPlayer vrMode={vrMode} setVrMode={setVrMode} onExit={() => { setVrMode(false); setCurrentView('landing'); setBroadcastData(null); setActiveBroadcastId(null); }} gyroRequested={gyroRequested} setGyroRequested={setGyroRequested} broadcastData={broadcastData} isMuted={isMuted} setIsMuted={setIsMuted} />
                    )}
                    {currentView === 'teacher_auth' && <TeacherAuth onAuthenticated={() => setCurrentView('teacher')} onCancel={() => setCurrentView('landing')} />}
                    {currentView === 'teacher' && <TeacherConsole onLogout={() => setCurrentView('landing')} onBroadcastAction={handleTeacherBroadcastAction} activeBroadcastId={activeBroadcastId} />}
                </div>
            );
        }

        function LandingScreen({ onEnterStudent, onEnterTeacher }) {
            return (
                <div className="relative w-full h-full flex flex-col items-center justify-center p-6">
                    <div className="neon-bg">
                        <div className="blob w-[30rem] h-[30rem] bg-eco-500 rounded-full left-[-10rem] top-[-10rem]"></div>
                        <div className="blob w-[40rem] h-[40rem] bg-cyan-600 rounded-full right-[-15rem] bottom-[-10rem]" style={{animationDelay: '2s'}}></div>
                        
                        <div className="float-icon w-32 h-32 top-10 left-10 text-cyan-200"><EcoEarth /></div>
                        <div className="float-icon w-24 h-24 top-40 right-20 text-eco-300" style={{animationDelay: '1s'}}><EcoLeaf /></div>
                        <div className="float-icon w-28 h-28 bottom-32 left-32 text-blue-300" style={{animationDelay: '2s'}}><EcoSunCloud /></div>
                        <div className="float-icon w-24 h-24 bottom-10 right-1/4 text-yellow-200" style={{animationDelay: '3s'}}><EcoFox /></div>
                        <div className="float-icon w-16 h-16 top-1/2 left-1/4 text-pink-300" style={{animationDelay: '4s'}}><EcoBird /></div>
                    </div>

                    <div className="z-10 text-center w-full max-w-4xl glass-panel p-8 md:p-16 rounded-[2.5rem] relative shadow-2xl">
                        {/* IKON KOTAK VR MENGAMBANG SESUAI REFERENSI */}
                        <div className="absolute -top-12 -right-6 md:-top-20 md:-right-12 w-24 h-24 md:w-36 md:h-36 bg-black/60 border border-cyan-500/50 backdrop-blur-xl rounded-3xl flex items-center justify-center shadow-[0_0_30px_rgba(8,145,178,0.5)] rotate-12 animate-floatSlow z-50">
                            <svg className="w-12 h-12 md:w-16 md:h-16 text-cyan-400 drop-shadow-[0_0_15px_rgba(6,182,212,1)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                                <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" opacity="0.1"/>
                                <rect x="2" y="7" width="20" height="10" rx="3" ry="3" fill="#000" strokeWidth="2.5"></rect>
                                <path d="M6 17v1a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-1" strokeWidth="2.5"></path>
                                <line x1="12" y1="7" x2="12" y2="17" strokeWidth="2.5"></line>
                            </svg>
                        </div>

                        <div className="inline-block px-5 py-2 rounded-full bg-eco-500/10 text-eco-400 font-bold text-[10px] md:text-xs tracking-widest uppercase mb-4 md:mb-6 border border-eco-500/30 relative">
                            Harmoni Kehidupan dalam Ekosistem
                        </div>
                        <h1 className="text-4xl sm:text-5xl md:text-7xl font-extrabold tracking-tight mb-8 md:mb-12 text-transparent bg-clip-text bg-gradient-to-br from-white via-cyan-100 to-eco-400 relative drop-shadow-sm">
                            CAKRA-SAINS VR
                        </h1>

                        <div className="flex flex-col sm:flex-row items-center justify-center gap-4 md:gap-6 relative w-full">
                            <button onClick={onEnterStudent} className="w-full sm:w-auto px-6 py-3.5 md:px-8 md:py-4 bg-gradient-to-r from-eco-600 to-cyan-600 hover:opacity-90 text-white rounded-2xl font-bold text-sm md:text-lg transition-all shadow-[0_0_20px_rgba(16,185,129,0.5)] flex items-center justify-center gap-3">
                                <IconVR /> PORTAL SISWA
                            </button>
                            <button onClick={onEnterTeacher} className="w-full sm:w-auto px-6 py-3.5 md:px-8 md:py-4 bg-white/5 hover:bg-white/10 border border-white/20 text-white rounded-2xl font-bold text-sm md:text-lg transition-all flex items-center justify-center shadow-lg">
                                KONSOL GURU
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function TeacherAuth({ onAuthenticated, onCancel }) {
            const [password, setPassword] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [error, setError] = useState('');
            
            const handleSubmit = (e) => {
                e.preventDefault();
                if (password === 'cakra-sains') onAuthenticated();
                else { setError('Sandi salah!'); setPassword(''); }
            };
            
            return (
                <div className="relative w-full h-[100dvh] flex flex-col items-center justify-center p-6 bg-[#000000]">
                    <div className="absolute top-6 right-6"><button onClick={onCancel} className="px-4 py-2 glass-panel rounded-full text-sm">Batal</button></div>
                    <div className="glass-panel border border-white/10 p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl">
                        <div className="w-16 h-16 bg-blue-500/20 text-cyan-400 rounded-full flex items-center justify-center mx-auto mb-6"><IconSettings /></div>
                        <h2 className="text-2xl font-bold mb-6">Akses Guru</h2>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="relative">
                                <input type={showPassword ? "text" : "password"} value={password} onChange={(e) => { setPassword(e.target.value); setError(''); }} placeholder="Masukkan Sandi" className="w-full bg-black/50 border border-white/20 rounded-xl px-4 py-3 pr-12 text-center focus:border-cyan-500 outline-none text-white transition-colors" autoFocus />
                                <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-3 top-1/2 -translate-y-1/2 p-2 text-slate-400 hover:text-white">
                                    {showPassword ? <IconEyeClosed /> : <IconEyeOpen />}
                                </button>
                            </div>
                            {error && <p className="text-red-400 text-xs font-bold">{error}</p>}
                            <button type="submit" className="w-full py-3 bg-gradient-to-r from-eco-600 to-cyan-600 text-white font-bold rounded-xl shadow-lg hover:opacity-90">Masuk</button>
                        </form>
                    </div>
                </div>
            );
        }

        function TeacherConsole({ onLogout, onBroadcastAction, activeBroadcastId }) {
            const [mediaList, setMediaList] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [error, setError] = useState('');
            const [isUploading, setIsUploading] = useState(false);
            const fileInputRef = useRef(null);

            const fetchMedia = async () => {
                setIsLoading(true); setError('');
                try {
                    const data = await supabaseApi(`/films?id=neq.${BROADCAST_SIGNAL_ID}&select=*&order=created_at.desc`);
                    setMediaList(data || []);
                } catch (err) {
                    setError("Gagal memuat data dari Supabase. Pastikan tabel 'films' telah dibuat.");
                } finally { setIsLoading(false); }
            };

            useEffect(() => { fetchMedia(); }, []);

            const handleFileChange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsUploading(true); setError('');
                try {
                    const fileExt = file.name.split('.').pop();
                    const fileName = `vid_${Date.now()}.${fileExt}`;
                    const storageUrl = `${SUPABASE_URL}/storage/v1/object/${STORAGE_BUCKET}/${fileName}`;
                    
                    const uploadRes = await fetch(storageUrl, {
                        method: 'POST',
                        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': file.type },
                        body: file
                    });
                    if (!uploadRes.ok) throw new Error("Gagal unggah ke Storage.");
                    
                    const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${fileName}`;
                    const newRecord = { title: file.name.replace(`.${fileExt}`, ''), format: '360 Video', is_video: true, url: publicUrl, created_at: new Date().toISOString() };
                    
                    await supabaseApi('/films', { method: 'POST', body: JSON.stringify(newRecord) });
                    fetchMedia();
                } catch (err) { setError("Upload gagal. Pastikan Bucket 'videos' publik."); } 
                finally { setIsUploading(false); if (fileInputRef.current) fileInputRef.current.value = ''; }
            };

            const handleDelete = async (id) => {
                // Penggunaan custom konfirmasi atau error state, kita gunakan yang ada
                if(!window.confirm("Hapus file ini secara permanen?")) return;
                try { await supabaseApi(`/films?id=eq.${id}`, { method: 'DELETE' }); fetchMedia(); } 
                catch(err) { setError("Gagal menghapus file."); }
            };

            const handleBroadcastToggle = (media) => {
                const isCurrentlyBroadcasting = activeBroadcastId === media.id.toString();
                if (isCurrentlyBroadcasting) {
                    onBroadcastAction(null, true); // Hentikan
                } else {
                    onBroadcastAction(media, false); // Mulai siaran baru
                }
            };

            return (
                <div className="w-full h-[100dvh] flex flex-col bg-[#000000]">
                    <div className="glass-panel p-4 md:p-5 flex justify-between items-center z-10 border-b-0 rounded-b-2xl mx-2 md:mx-4 mt-2">
                        <div className="flex items-center gap-3">
                            <h2 className="font-bold text-base md:text-lg tracking-wide text-white px-2">Konsol Guru</h2>
                        </div>
                        <button onClick={onLogout} className="px-3 py-1.5 md:px-4 md:py-2 bg-red-500/10 text-red-400 rounded-lg text-xs md:text-sm hover:bg-red-500/20 font-semibold border border-red-500/30">Tutup Kendali</button>
                    </div>
                    
                    <div className="flex-1 overflow-y-auto p-3 md:p-8">
                        <div className="glass-panel rounded-3xl p-4 md:p-8">
                            {error && <div className="mb-4 p-3 bg-red-500/20 border border-red-500 rounded-lg text-red-400 text-xs font-bold">{error}</div>}

                            <div className="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 gap-4 border-b border-white/10 pb-4 md:pb-6">
                                <div>
                                    <h3 className="text-2xl md:text-3xl font-bold text-white mb-1">Pustaka Media</h3>
                                    <p className="text-slate-400 text-xs md:text-sm">Kelola materi untuk Portal Siswa.</p>
                                </div>
                                <div className="flex gap-2 w-full md:w-auto">
                                    <button onClick={fetchMedia} className="flex-1 md:flex-none px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs md:text-sm font-semibold">🔄 Refresh</button>
                                    <button onClick={() => fileInputRef.current.click()} disabled={isUploading} className="flex-1 md:flex-none px-4 py-2 bg-white text-black hover:bg-slate-200 rounded-xl text-xs md:text-sm font-bold shadow-lg truncate">
                                        {isUploading ? 'Memproses...' : '+ Tambah Film'}
                                    </button>
                                    <input type="file" ref={fileInputRef} onChange={handleFileChange} accept="video/mp4,video/webm" className="hidden" />
                                </div>
                            </div>

                            {isLoading ? (
                                <div className="text-center py-10 text-slate-500 text-sm animate-pulse">Memuat data dari database...</div>
                            ) : mediaList.length === 0 ? (
                                <div className="text-center py-16 border border-dashed border-white/20 rounded-2xl text-slate-500 text-sm font-medium mx-2">
                                    Belum ada film di server.
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4 md:gap-6">
                                    {mediaList.map((media) => {
                                        const isLive = activeBroadcastId === media.id.toString();
                                        return (
                                            <div key={media.id} className={`glass-panel rounded-2xl overflow-hidden flex flex-col group transition-all ${isLive ? 'border-red-500/50 shadow-[0_0_15px_rgba(239,68,68,0.2)]' : 'border-white/10 hover:border-cyan-500/30'}`}>
                                                <div className="h-32 md:h-40 bg-black/60 relative flex items-center justify-center overflow-hidden border-b border-white/5">
                                                    <IconFilm />
                                                    <button onClick={() => handleDelete(media.id)} className="absolute top-2 right-2 p-1.5 md:p-2 bg-black/80 text-red-400 rounded-lg opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity hover:bg-red-900 hover:text-white border border-red-500/30">
                                                        <IconTrash />
                                                    </button>
                                                    {isLive && (
                                                        <div className="absolute top-2 left-2 bg-red-600 text-white text-[9px] md:text-[10px] font-bold px-2 py-1 rounded shadow-lg flex items-center gap-1.5 animate-pulse">
                                                            <div className="w-1.5 h-1.5 bg-white rounded-full"></div> LIVE
                                                        </div>
                                                    )}
                                                </div>
                                                <div className="p-4 flex-1 flex flex-col bg-black/20">
                                                    <h4 className="font-bold text-sm md:text-base mb-3 line-clamp-2 text-white">{media.title}</h4>
                                                    <div className="mt-auto">
                                                        <button onClick={() => handleBroadcastToggle(media)} className={`w-full py-2.5 rounded-xl text-xs md:text-sm font-bold transition-all border flex justify-center items-center gap-2 ${isLive ? 'bg-red-600/20 text-red-400 border-red-500/50 hover:bg-red-600/40' : 'bg-gradient-to-r from-eco-600 to-cyan-600 text-white border-transparent shadow-lg hover:opacity-90'}`}>
                                                            {isLive ? <><IconStop /> Hentikan Siaran</> : '▶ Siarkan ke Siswa'}
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function StudentWaitingRoom({ onEnterVR, onExit }) {
            return (
                <div className="w-full h-[100dvh] flex flex-col items-center justify-center bg-[#000000] p-6 relative">
                    <div className="absolute top-6 left-6"><button onClick={onExit} className="px-4 py-2 glass-panel rounded-full text-xs hover:bg-white/10">Batal</button></div>
                    <div className="w-24 h-24 md:w-32 md:h-32 rounded-full border-4 border-slate-800 border-t-cyan-400 animate-spin mb-6 md:mb-8 shadow-[0_0_30px_rgba(8,145,178,0.2)]"></div>
                    <h2 className="text-3xl md:text-4xl font-bold mb-3 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 text-center">Menunggu Siaran</h2>
                    <p className="text-slate-400 text-center max-w-md text-sm md:text-base mb-8">
                        Film pembelajaran VR akan dimulai otomatis saat Guru menyiarkannya.
                    </p>
                    <button onClick={onEnterVR} className="opacity-0 w-1 h-1">Bypass</button> {/* Hidden bypass */}
                </div>
            );
        }

        function VRPlayer({ vrMode, setVrMode, onExit, gyroRequested, setGyroRequested, broadcastData, isMuted, setIsMuted }) {
            const containerRef = useRef(null);
            const [threeLoaded, setThreeLoaded] = useState(false);
            const [hudMessage, setHudMessage] = useState('Menyiapkan pemutar...');
            const [videoError, setVideoError] = useState(false);
            const [isUiVisible, setIsUiVisible] = useState(true);

            // Auto-hide UI Logic in Fullscreen
            useEffect(() => {
                let timeout;
                const resetTimer = () => {
                    setIsUiVisible(true);
                    clearTimeout(timeout);
                    if (document.fullscreenElement || document.webkitFullscreenElement || document.body.classList.contains('fallback-fullscreen')) {
                        timeout = setTimeout(() => setIsUiVisible(false), 3000);
                    }
                };

                window.addEventListener('mousemove', resetTimer);
                window.addEventListener('touchstart', resetTimer);
                window.addEventListener('click', resetTimer);
                document.addEventListener('fullscreenchange', resetTimer);
                document.addEventListener('webkitfullscreenchange', resetTimer);
                resetTimer();

                return () => {
                    window.removeEventListener('mousemove', resetTimer);
                    window.removeEventListener('touchstart', resetTimer);
                    window.removeEventListener('click', resetTimer);
                    document.removeEventListener('fullscreenchange', resetTimer);
                    document.removeEventListener('webkitfullscreenchange', resetTimer);
                    clearTimeout(timeout);
                };
            }, []);

            useEffect(() => {
                if (window.THREE) { setThreeLoaded(true); return; }
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
                script.onload = () => setThreeLoaded(true);
                document.body.appendChild(script);
            }, []);

            // THREE.JS LOGIC
            useEffect(() => {
                if (!threeLoaded || !containerRef.current) return;

                const container = containerRef.current;
                const THREE = window.THREE;
                let animationFrameId;
                let localVideoElement = null; 
                let videoTexture = null;

                // PERLINDUNGAN ANTI-BLANK: Memaksa dimensi jika kontainer 0x0
                let w = container.clientWidth || window.innerWidth || 300;
                let h = container.clientHeight || window.innerHeight || 300;

                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x020617); // Background kosmik aman
                scene.fog = new THREE.FogExp2(0x020617, 0.015);

                const aspect = w / h;
                const camera = new THREE.PerspectiveCamera(75, aspect, 0.1, 1000);
                const cameraL = new THREE.PerspectiveCamera(75, aspect / 2, 0.1, 1000);
                const cameraR = new THREE.PerspectiveCamera(75, aspect / 2, 0.1, 1000);
                const eyeSep = 0.6;

                const cameraRig = new THREE.Group();
                cameraRig.add(camera);
                scene.add(cameraRig);

                const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "low-power" });
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
                renderer.setSize(w, h);
                container.appendChild(renderer.domElement);

                // --- LOGIKA VIDEO AMAN (FAIL-SAFE) ---
                if (broadcastData && broadcastData.type === 'video') {
                    // 1. Buat Bola Dasar Hitam agar WebGL tidak crash sebelum video dimuat
                    const sphereGeo = new THREE.SphereGeometry(500, 60, 40);
                    sphereGeo.scale(-1, 1, 1);
                    const dummyMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
                    const videoMesh = new THREE.Mesh(sphereGeo, dummyMat);
                    scene.add(videoMesh);

                    // 2. Setup Video Element
                    localVideoElement = document.createElement('video');
                    localVideoElement.crossOrigin = "anonymous";
                    localVideoElement.src = broadcastData.data.url;
                    localVideoElement.loop = true;
                    // Video mulai mute agar diizinkan autoplay oleh browser mobile
                    localVideoElement.muted = true; 
                    localVideoElement.playsInline = true;
                    localVideoElement.setAttribute('webkit-playsinline', 'webkit-playsinline');

                    localVideoElement.addEventListener('error', (e) => {
                        console.warn("Video Error:", e);
                        if (!videoError) { setVideoError(true); setHudMessage("Gagal memuat video."); }
                    });

                    // 3. Hanya pasang tekstur JIKA video sudah punya data frame pertama
                    localVideoElement.addEventListener('loadeddata', () => {
                        localVideoElement.play().then(() => {
                            videoTexture = new THREE.VideoTexture(localVideoElement);
                            videoTexture.minFilter = THREE.LinearFilter;
                            videoTexture.magFilter = THREE.LinearFilter;
                            videoTexture.format = THREE.RGBFormat;
                            // Ganti material hitam dengan video
                            videoMesh.material = new THREE.MeshBasicMaterial({ map: videoTexture });
                            setHudMessage('');
                        }).catch(e => {
                            console.warn("Autoplay block", e);
                            setHudMessage("Sentuh layar untuk memulai video.");
                        });
                    });

                    const forcePlay = () => {
                        if (localVideoElement && localVideoElement.paused) {
                            localVideoElement.play().then(() => {
                                if(!videoTexture && localVideoElement.readyState >= 3){
                                    videoTexture = new THREE.VideoTexture(localVideoElement);
                                    videoTexture.minFilter = THREE.LinearFilter;
                                    videoTexture.format = THREE.RGBFormat;
                                    videoMesh.material = new THREE.MeshBasicMaterial({ map: videoTexture });
                                }
                                setHudMessage('');
                            }).catch(()=>{});
                        }
                    };
                    container.addEventListener('touchstart', forcePlay, {once:true});
                    container.addEventListener('click', forcePlay, {once:true});

                    setHudMessage('Memuat Film VR...');
                } else {
                    // Fallback Ruang Demo Statis (Jika bukan video)
                    const gridHelper = new THREE.GridHelper(300, 60, 0x10b981, 0x064e3b);
                    gridHelper.position.y = -15;
                    scene.add(gridHelper);
                    setHudMessage('Ruang Kosong. Menunggu siaran video.');
                }

                // CONTROLS (Manual & Gyro)
                let isDragging = false;
                let previousMousePosition = { x: 0, y: 0 };
                let lon = -90, lat = 0; 
                let deviceOrientationData = null;

                const onDown = (e) => { isDragging = true; previousMousePosition = { x: e.touches?.[0].clientX || e.clientX, y: e.touches?.[0].clientY || e.clientY }; };
                const onUp = () => isDragging = false;
                const onMove = (e) => {
                    if(!isDragging || deviceOrientationData) return;
                    const x = e.touches?.[0].clientX || e.clientX, y = e.touches?.[0].clientY || e.clientY;
                    lon -= (x - previousMousePosition.x) * 0.15; lat -= (y - previousMousePosition.y) * 0.15;
                    lat = Math.max(-85, Math.min(85, lat)); previousMousePosition = { x, y };
                };
                const onOrientation = (e) => { if (e.alpha !== null) deviceOrientationData = e; };

                container.addEventListener('mousedown', onDown); window.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onUp);
                container.addEventListener('touchstart', onDown, {passive: false}); window.addEventListener('touchmove', onMove, {passive: false}); window.addEventListener('touchend', onUp);
                window.addEventListener('deviceorientation', onOrientation);

                const onResize = () => {
                    const nw = container.clientWidth || window.innerWidth;
                    const nh = container.clientHeight || window.innerHeight;
                    if (nw === 0 || nh === 0) return;
                    renderer.setSize(nw, nh);
                    camera.aspect = nw / nh; camera.updateProjectionMatrix();
                    cameraL.aspect = (nw/nh) / 2; cameraL.updateProjectionMatrix();
                    cameraR.aspect = (nw/nh) / 2; cameraR.updateProjectionMatrix();
                };
                window.addEventListener('resize', onResize);

                const animate = () => {
                    animationFrameId = requestAnimationFrame(animate);

                    if (deviceOrientationData) {
                        const alpha = THREE.MathUtils.degToRad(deviceOrientationData.alpha);
                        const beta = THREE.MathUtils.degToRad(deviceOrientationData.beta);
                        const gamma = THREE.MathUtils.degToRad(deviceOrientationData.gamma);
                        cameraRig.rotation.set(0, 0, 0); cameraRig.rotateY(alpha); cameraRig.rotateX(beta); cameraRig.rotateZ(gamma);
                    } else {
                        const phi = THREE.MathUtils.degToRad(90 - lat);
                        const theta = THREE.MathUtils.degToRad(lon);
                        cameraRig.lookAt(500 * Math.sin(phi) * Math.cos(theta), 500 * Math.cos(phi), 500 * Math.sin(phi) * Math.sin(theta));
                    }

                    if (localVideoElement) localVideoElement.muted = isMuted;

                    if (vrMode) {
                        const size = renderer.getSize(new THREE.Vector2());
                        cameraRig.getWorldPosition(cameraL.position); cameraRig.getWorldQuaternion(cameraL.quaternion); cameraL.translateX(-eyeSep / 2);
                        cameraRig.getWorldPosition(cameraR.position); cameraRig.getWorldQuaternion(cameraR.quaternion); cameraR.translateX(eyeSep / 2);
                        
                        renderer.setScissorTest(true);
                        renderer.setScissor(0, 0, size.width / 2, size.height); renderer.setViewport(0, 0, size.width / 2, size.height);
                        renderer.render(scene, cameraL);
                        renderer.setScissor(size.width / 2, 0, size.width / 2, size.height); renderer.setViewport(size.width / 2, 0, size.width / 2, size.height);
                        renderer.render(scene, cameraR);
                        renderer.setScissorTest(false);
                    } else {
                        renderer.setViewport(0, 0, container.clientWidth, container.clientHeight);
                        renderer.render(scene, cameraRig.children[0]);
                    }
                };
                animate();

                return () => {
                    cancelAnimationFrame(animationFrameId);
                    window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp);
                    window.removeEventListener('touchmove', onMove); window.removeEventListener('touchend', onUp);
                    window.removeEventListener('deviceorientation', onOrientation); window.removeEventListener('resize', onResize);
                    if(container.contains(renderer.domElement)) container.removeChild(renderer.domElement);
                    renderer.dispose();
                    if (localVideoElement) {
                        localVideoElement.pause(); localVideoElement.removeAttribute('src'); localVideoElement.load(); localVideoElement = null;
                    }
                };
            }, [threeLoaded, vrMode, broadcastData]); 

            const requestGyro = async () => {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    try {
                        const permissionState = await DeviceOrientationEvent.requestPermission();
                        if (permissionState === 'granted') { setGyroRequested(true); setHudMessage('Sensor Gyro Aktif.'); } 
                        else { setHudMessage('Sensor ditolak.'); }
                    } catch (error) { console.error(error); }
                } else { setGyroRequested(true); }
                setTimeout(() => setHudMessage(''), 3000);
            };

            const handleFullscreen = () => {
                const elem = document.documentElement;
                if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.body.classList.contains('fallback-fullscreen')) {
                    if (elem.requestFullscreen) {
                        elem.requestFullscreen().catch(() => document.body.classList.add('fallback-fullscreen'));
                    } else if (elem.webkitRequestFullscreen) {
                        elem.webkitRequestFullscreen(); 
                        setTimeout(() => { if(!document.webkitFullscreenElement) document.body.classList.add('fallback-fullscreen'); }, 500);
                    } else {
                        document.body.classList.add('fallback-fullscreen');
                    }
                } else {
                    document.body.classList.remove('fallback-fullscreen');
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                }
            };

            return (
                <div className="relative w-full h-[100dvh] bg-black overflow-hidden">
                    <div ref={containerRef} className="absolute inset-0 cursor-move"></div>
                    {vrMode && <div className="absolute top-0 bottom-0 left-1/2 w-[2px] bg-black/80 z-10 shadow-[0_0_15px_rgba(0,0,0,1)]"></div>}

                    {hudMessage && (
                        <div className="absolute top-10 md:top-1/4 left-1/2 -translate-x-1/2 z-20 pointer-events-none w-11/12 max-w-sm text-center">
                            <div className="inline-block bg-black/70 text-cyan-300 px-4 py-2 md:px-6 md:py-3 rounded-full backdrop-blur-md border border-cyan-500/30 text-xs md:text-sm font-semibold tracking-wide shadow-[0_0_20px_rgba(8,145,178,0.4)] animate-pulse">
                                {hudMessage}
                            </div>
                        </div>
                    )}

                    <div className={`absolute inset-x-0 bottom-0 p-4 md:p-6 flex justify-between items-end z-30 transition-opacity duration-500 ${isUiVisible ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}>
                        <div className="flex flex-col gap-2 pointer-events-auto">
                            <button onClick={() => { document.body.classList.remove('fallback-fullscreen'); onExit(); }} className="px-4 py-2.5 md:px-5 md:py-3 bg-red-600/80 backdrop-blur hover:bg-red-500 text-white rounded-xl md:rounded-2xl font-bold shadow-lg border border-red-400/30 transition-colors text-xs md:text-sm w-fit">
                                ✕ Keluar
                            </button>
                            {!gyroRequested && (
                                <button onClick={requestGyro} className="px-3 py-2 bg-white/10 backdrop-blur text-white rounded-lg text-[10px] md:text-xs border border-white/20 hover:bg-white/20 w-fit">
                                    Aktifkan Gyro
                                </button>
                            )}
                        </div>
                        
                        <div className="flex gap-2 md:gap-3 pointer-events-auto">
                            <button onClick={() => setIsMuted(!isMuted)} className={`w-10 h-10 md:w-12 md:h-12 rounded-xl flex items-center justify-center backdrop-blur transition-all shadow-lg border text-white ${isMuted ? 'bg-red-600/80 border-red-500' : 'bg-blue-600/80 border-blue-400'}`}>
                                {isMuted ? <IconVolumeOff /> : <IconVolumeUp />}
                            </button>
                            <button onClick={() => setVrMode(!vrMode)} className={`w-10 h-10 md:w-12 md:h-12 rounded-xl flex items-center justify-center backdrop-blur transition-all shadow-lg border ${vrMode ? 'bg-cyan-600 text-white border-cyan-400' : 'bg-black/50 border-white/20 text-slate-300 hover:bg-white/10'}`}>
                                <IconVR />
                            </button>
                            <button onClick={handleFullscreen} className="w-10 h-10 md:w-12 md:h-12 rounded-xl flex items-center justify-center backdrop-blur transition-all shadow-lg border bg-black/50 border-white/20 text-slate-300 hover:bg-white/10">
                                <IconFullscreen />
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<CakraSainsApp />, document.getElementById('root'));
    </script>
</body>
</html>
