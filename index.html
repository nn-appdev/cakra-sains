<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CAKRA-SAINS VR - Ekosistem Pembelajaran Imersif</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { eco: { 400: '#34d399', 500: '#10b981', 600: '#059669' } }
                }
            }
        }
    </script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Three.js & VR Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/effects/StereoEffect.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DeviceOrientationControls.js"></script>

    <style>
        body { 
            background: #000000; color: #f8fafc; overflow: hidden; margin: 0; padding: 0; touch-action: none;
            -webkit-user-select: none; user-select: none;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* --- STYLING LENSA CARDBOARD --- */
        .vr-lens-container {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background-color: #000; padding: 10px;
        }
        .vr-lens-mask {
            width: 100%; height: 100%; border-radius: 35%; overflow: hidden; position: relative; background: #111; box-shadow: inset 0 0 50px rgba(0,0,0,1); transform: scale(1.05);
        }
        .vr-video { width: 100%; height: 100%; object-fit: cover; }
        .normal-video { width: 100%; height: 100%; object-fit: contain; }

        /* Fallback Fullscreen Ekstrim untuk HP yang memblokir API asli */
        .fallback-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100dvh !important;
            z-index: 99999 !important;
            background-color: black !important;
        }

        /* Latar Belakang Animasi Landing Page */
        .neon-bg {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 0; overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #064e3b 0%, #020617 70%);
        }
        .blob {
            position: absolute; filter: blur(80px); opacity: 0.4; animation: float 10s infinite ease-in-out alternate;
        }
        
        .float-icon {
            position: absolute; opacity: 0.15; filter: drop-shadow(0 0 12px rgba(52,211,153,0.9));
            animation: floatSlow 15s infinite linear alternate;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-20px) scale(1.1); }
        }
        @keyframes floatSlow {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-40px) rotate(15deg); }
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(6, 182, 212, 0.4); }
            50% { box-shadow: 0 0 30px rgba(6, 182, 212, 0.8); }
            100% { box-shadow: 0 0 15px rgba(6, 182, 212, 0.4); }
        }
        .animate-glow { animation: pulseGlow 3s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICONS ---
        const IconFilm = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>;
        const IconVR = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.52 7.15L15 4V3a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v18a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-1l6.52-3.15a1 1 0 0 0 .48-.9V8.05a1 1 0 0 0-.48-.9z"></path><path d="M15 12v.01"></path><path d="M15 8v.01"></path><path d="M15 16v.01"></path></svg>;
        const IconTrash = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;
        const IconVolumeUp = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>;
        const IconVolumeOff = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="1" x2="1" y2="23"></line></svg>;
        const IconFullscreen = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>;
        const IconEyeOpen = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>;
        const IconEyeClosed = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>;
        const IconQuiz = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>;
        
        // --- ICONS EKOSISTEM ---
        const EcoEarth = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>;
        const EcoLeaf = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><line x1="2" y1="22" x2="11" y2="20"/></svg>;
        const EcoSunCloud = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="20" y1="5" x2="22" y2="6"/></svg>;
        const EcoBird = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10z"/><path d="M9 10h.01M15 10h.01"/></svg>;
        const EcoFox = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><polygon points="12 22 2 10 12 2 22 10 12 22"/><path d="M2 10l10 5 10-5"/></svg>;

        // --- KONFIGURASI SUPABASE ---
        const SUPABASE_URL = "https://xltrmoeabasrconlhijv.supabase.co";
        const SUPABASE_KEY = "sb_publishable_kzMgSC5JniUeJZGBGW1RIA_7aKyk0vh";
        const STORAGE_BUCKET = "videos"; // Reused for images as well

        const supabaseApi = async (endpoint, options = {}) => {
            const res = await fetch(`${SUPABASE_URL}/rest/v1${endpoint}`, {
                ...options,
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=representation',
                    ...(options.headers || {})
                }
            });
            if (!res.ok) throw new Error(`API Error: ${res.status}`);
            return res.status === 204 ? null : await res.json();
        };

        function CakraSainsApp() {
            const [currentView, setCurrentView] = useState('landing');
            const [vrMode, setVrMode] = useState(false);
            const [isMuted, setIsMuted] = useState(true);
            const [broadcastData, setBroadcastData] = useState(null);
            const [activeBroadcastId, setActiveBroadcastId] = useState(null); 

            // SINKRONISASI REAL-TIME LINTAS PERANGKAT DENGAN SUPABASE
            useEffect(() => {
                const checkBroadcastState = async () => {
                    try {
                        const stateData = await supabaseApi('/broadcast_state?select=film_id&id=eq.1');
                        const activeFilmId = stateData[0]?.film_id;

                        if (activeFilmId) {
                            if (activeFilmId !== activeBroadcastId) {
                                const filmData = await supabaseApi(`/films?id=eq.${activeFilmId}&select=*`);
                                if (filmData && filmData[0]) {
                                    const media = filmData[0];
                                    
                                    // Parse if it's a quiz disguised in the URL column
                                    let payloadData = media;
                                    let type = 'video';
                                    if (media.format === 'Quiz') {
                                        type = 'quiz';
                                        payloadData = JSON.parse(media.url);
                                    }

                                    const payload = { type: type, data: payloadData, timestamp: Date.now() };
                                    setBroadcastData(payload);
                                    setActiveBroadcastId(activeFilmId);
                                    localStorage.setItem('cakra_broadcast', JSON.stringify(payload));

                                    if (currentView === 'waiting') {
                                        setVrMode(true);
                                        setCurrentView('player');
                                    }
                                }
                            }
                        } else {
                            if (activeBroadcastId !== null) {
                                setBroadcastData(null);
                                setActiveBroadcastId(null);
                                localStorage.removeItem('cakra_broadcast');
                            }
                        }
                    } catch (e) {
                        console.warn("Polling error. Pastikan tabel 'broadcast_state' dan 'films' sudah dibuat.", e);
                    }
                };

                const interval = setInterval(checkBroadcastState, 3000);
                checkBroadcastState();

                const handleStorageChange = (e) => {
                    if (e.key === 'cakra_broadcast' && e.newValue) {
                        const payload = JSON.parse(e.newValue);
                        setBroadcastData(payload);
                        setActiveBroadcastId(payload.data.id || payload.timestamp);
                    }
                };
                window.addEventListener('storage', handleStorageChange);

                return () => {
                    clearInterval(interval);
                    window.removeEventListener('storage', handleStorageChange);
                };
            }, [currentView, activeBroadcastId]);

            const handleBroadcast = async (media) => {
                try {
                    await supabaseApi('/broadcast_state?id=eq.1', {
                        method: 'PATCH',
                        body: JSON.stringify({ film_id: media.id, updated_at: new Date().toISOString() })
                    });
                    
                    let type = 'video';
                    let payloadData = media;
                    if (media.format === 'Quiz') {
                        type = 'quiz';
                        payloadData = JSON.parse(media.url);
                    }

                    const payload = { type: type, data: payloadData, timestamp: Date.now() };
                    setBroadcastData(payload);
                    setActiveBroadcastId(media.id);
                    localStorage.setItem('cakra_broadcast', JSON.stringify(payload));
                    
                } catch (error) {
                    alert("Gagal memulai siaran. Pastikan tabel database benar.");
                }
            };

            const handleStopBroadcast = async () => {
                try {
                    await supabaseApi('/broadcast_state?id=eq.1', {
                        method: 'PATCH',
                        body: JSON.stringify({ film_id: null, updated_at: new Date().toISOString() })
                    });
                    setBroadcastData(null);
                    setActiveBroadcastId(null);
                    localStorage.removeItem('cakra_broadcast');
                } catch (error) {
                    console.error("Gagal menghentikan siaran:", error);
                }
            };

            return (
                <div id="app-container" className="w-full h-screen text-white font-sans overflow-hidden selection:bg-cyan-500/30 bg-[#000000]">
                    {currentView === 'landing' && <LandingScreen onEnterStudent={() => { setVrMode(true); setCurrentView('player'); }} onEnterTeacher={() => setCurrentView('teacher')} />}
                    {currentView === 'player' && <MasterPlayer vrMode={vrMode} setVrMode={setVrMode} isMuted={isMuted} setIsMuted={setIsMuted} onExit={() => { setCurrentView('landing'); }} broadcastData={broadcastData} />}
                    {currentView === 'teacher' && <TeacherConsole onLogout={() => setCurrentView('landing')} onBroadcast={handleBroadcast} onStopBroadcast={handleStopBroadcast} broadcastData={broadcastData} />}
                </div>
            );
        }

        // --- LANDING SCREEN ---
        function LandingScreen({ onEnterStudent, onEnterTeacher }) {
            return (
                <div className="relative w-full h-full flex flex-col items-center justify-center p-6">
                    <div className="neon-bg">
                        <div className="blob w-[30rem] h-[30rem] bg-eco-500 rounded-full left-[-10rem] top-[-10rem]"></div>
                        <div className="blob w-[40rem] h-[40rem] bg-cyan-600 rounded-full right-[-15rem] bottom-[-10rem]" style={{animationDelay: '2s'}}></div>
                        
                        <div className="float-icon w-32 h-32 top-10 left-10 text-cyan-200"><EcoEarth /></div>
                        <div className="float-icon w-24 h-24 top-40 right-20 text-eco-300" style={{animationDelay: '1s'}}><EcoLeaf /></div>
                        <div className="float-icon w-28 h-28 bottom-32 left-32 text-blue-300" style={{animationDelay: '2s'}}><EcoSunCloud /></div>
                        <div className="float-icon w-24 h-24 bottom-10 right-1/4 text-yellow-200" style={{animationDelay: '3s'}}><EcoFox /></div>
                        <div className="float-icon w-16 h-16 top-1/2 left-1/4 text-pink-300" style={{animationDelay: '4s'}}><EcoBird /></div>
                    </div>

                    <div className="z-10 text-center max-w-4xl glass-panel p-10 md:p-16 rounded-[2.5rem] relative">
                        {/* PENGGANTIAN KARAKTER VR DENGAN IKON BOX ELEGAN */}
                        <div className="absolute -top-16 -right-8 md:-top-20 md:-right-12 w-32 h-32 md:w-40 md:h-40 bg-black/40 border border-cyan-500/30 backdrop-blur-xl rounded-3xl flex items-center justify-center animate-glow shadow-2xl rotate-12">
                            <svg className="w-16 h-16 md:w-20 md:h-20 text-cyan-400 drop-shadow-[0_0_10px_rgba(6,182,212,0.8)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                                <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" opacity="0.2"/>
                                <rect x="2" y="7" width="20" height="10" rx="3" ry="3" fill="#000" strokeWidth="2"></rect>
                                <path d="M6 17v1a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-1" strokeWidth="2"></path>
                                <line x1="12" y1="7" x2="12" y2="17" strokeWidth="2"></line>
                            </svg>
                        </div>

                        <div className="inline-block px-5 py-2 rounded-full bg-eco-500/10 text-eco-400 font-bold text-xs tracking-widest uppercase mb-6 border border-eco-500/30 relative">
                            Harmoni Kehidupan dalam Ekosistem
                        </div>
                        <h1 className="text-5xl md:text-7xl font-extrabold tracking-tight mb-12 text-transparent bg-clip-text bg-gradient-to-br from-white via-cyan-100 to-eco-400 relative">
                            CAKRA-SAINS VR
                        </h1>

                        <div className="flex flex-col sm:flex-row items-center justify-center gap-6 relative">
                            <button onClick={onEnterStudent} className="px-8 py-4 bg-gradient-to-r from-eco-600 to-cyan-600 hover:opacity-90 text-white rounded-2xl font-bold text-lg transition-all shadow-[0_0_20px_rgba(16,185,129,0.5)] flex items-center justify-center gap-3 w-full sm:w-auto">
                                <IconVR /> PORTAL SISWA
                            </button>
                            <button onClick={onEnterTeacher} className="px-8 py-4 bg-white/5 hover:bg-white/10 border border-white/20 text-white rounded-2xl font-bold text-lg transition-all flex items-center justify-center gap-3 w-full sm:w-auto shadow-lg">
                                KONSOL GURU
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- TEACHER CONSOLE ---
        function TeacherConsole({ onLogout, onBroadcast, onStopBroadcast, broadcastData }) {
            const [activeTab, setActiveTab] = useState('media'); // 'media' | 'quiz'
            const [mediaList, setMediaList] = useState([]);
            const [isUploading, setIsUploading] = useState(false);
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [password, setPassword] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [previewMedia, setPreviewMedia] = useState(null);
            
            // State Form Kuis
            const [quizQuestion, setQuizQuestion] = useState('');
            const [quizAssetFile, setQuizAssetFile] = useState(null);
            
            const [previewVrMode, setPreviewVrMode] = useState(false);
            const [previewIsMuted, setPreviewIsMuted] = useState(true);

            const fileInputRef = useRef(null);
            const quizAssetRef = useRef(null);
            const liveMediaId = broadcastData?.data?.id;

            const fetchMedia = async () => {
                try {
                    const data = await supabaseApi('/films?select=*&order=id.desc');
                    if (data) setMediaList(data);
                } catch (err) { console.warn("Koneksi Supabase gagal."); }
            };

            useEffect(() => { if (isAuthenticated) fetchMedia(); }, [isAuthenticated]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (password === 'cakra-sains') setIsAuthenticated(true);
                else alert('Sandi salah!');
            };

            const handleFileChange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsUploading(true);
                try {
                    const fileExt = file.name.split('.').pop();
                    const fileName = `vid_${Date.now()}.${fileExt}`;
                    const storageUrl = `${SUPABASE_URL}/storage/v1/object/${STORAGE_BUCKET}/${fileName}`;
                    
                    const uploadRes = await fetch(storageUrl, {
                        method: 'POST',
                        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': file.type },
                        body: file
                    });
                    if (!uploadRes.ok) throw new Error("Gagal unggah.");
                    const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${fileName}`;
                    const newRecord = { title: file.name.replace(`.${fileExt}`, ''), format: 'Video', is_video: true, url: publicUrl };

                    await supabaseApi('/films', { method: 'POST', body: JSON.stringify(newRecord) });
                    fetchMedia();
                } catch (err) { alert("Upload gagal."); } 
                finally { setIsUploading(false); }
            };

            // FUNGSI PEMBUATAN & SIMPAN KUIS
            const handleCreateQuiz = async (e) => {
                e.preventDefault();
                if (!quizQuestion) return alert("Pertanyaan harus diisi!");
                setIsUploading(true);

                try {
                    let assetUrl = null;
                    if (quizAssetFile) {
                        const fileExt = quizAssetFile.name.split('.').pop();
                        const fileName = `asset_${Date.now()}.${fileExt}`;
                        const storageUrl = `${SUPABASE_URL}/storage/v1/object/${STORAGE_BUCKET}/${fileName}`;
                        
                        const uploadRes = await fetch(storageUrl, {
                            method: 'POST',
                            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': quizAssetFile.type },
                            body: quizAssetFile
                        });
                        if (uploadRes.ok) {
                            assetUrl = `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${fileName}`;
                        }
                    }

                    // Enkripsi data kuis ke dalam format URL table films
                    const quizData = { question: quizQuestion, bgUrl: assetUrl };
                    const newRecord = { 
                        title: `Kuis: ${quizQuestion.substring(0, 20)}...`, 
                        format: 'Quiz', 
                        is_video: false, 
                        url: JSON.stringify(quizData) // Trik simpan JSON di Supabase
                    };

                    await supabaseApi('/films', { method: 'POST', body: JSON.stringify(newRecord) });
                    fetchMedia();
                    setQuizQuestion('');
                    setQuizAssetFile(null);
                    if(quizAssetRef.current) quizAssetRef.current.value = "";
                    alert("Kuis berhasil disimpan ke pustaka!");
                    setActiveTab('media');

                } catch(err) {
                    alert("Gagal membuat kuis.");
                } finally {
                    setIsUploading(false);
                }
            };

            const handleDelete = async (id) => {
                if(!window.confirm("Hapus item ini secara permanen?")) return;
                try { await supabaseApi(`/films?id=eq.${id}`, { method: 'DELETE' }); fetchMedia(); } 
                catch(err) { alert("Gagal menghapus."); }
            };

            if (!isAuthenticated) {
                return (
                    <div className="w-full h-full flex items-center justify-center p-6 bg-[#000000]">
                        <button onClick={onLogout} className="absolute top-6 right-6 px-4 py-2 glass-panel rounded-full text-sm">Batal</button>
                        <form onSubmit={handleLogin} className="glass-panel p-8 rounded-3xl max-w-sm w-full text-center">
                            <div className="w-16 h-16 bg-gradient-to-br from-eco-500 to-cyan-600 text-white rounded-full flex items-center justify-center mx-auto mb-6 shadow-[0_0_15px_rgba(16,185,129,0.5)]"><IconFilm /></div>
                            <h2 className="text-2xl font-bold mb-6">Akses Guru</h2>
                            <div className="relative mb-4">

                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-300 mb-2">Unggah Aset Latar Belakang (Gambar 360) - Opsional</label>
                                            <input type="file" ref={quizAssetRef} onChange={(e) => setQuizAssetFile(e.target.files[0])} accept="image/jpeg,image/png,image/webp" className="w-full bg-black/50 border border-white/20 rounded-xl p-3 text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-cyan-600 file:text-white hover:file:bg-cyan-500 cursor-pointer" />

                                        <div className="bg-blue-900/20 border border-blue-500/30 p-4 rounded-xl">
                                            <h4 className="text-blue-300 font-bold text-sm mb-2">Info Gestur untuk Siswa:</h4>

                                                <li>• Mendongak 2x = Menjawab Tidak / Menolak</li>

                                                <li>• Geleng Kiri 2x = Kembali</li>

                                        <button type="submit" disabled={isUploading} className="w-full py-4 bg-gradient-to-r from-eco-600 to-cyan-600 rounded-xl font-bold text-lg shadow-[0_0_15px_rgba(16,185,129,0.4)] hover:opacity-90">

                                </div>

                        </div>
                    </div>

                    {/* MODAL PRATINJAU GURU */}
                    {previewMedia && (
                        <div className="fixed inset-0 z-[99999] bg-black flex flex-col">
                            <div className="flex-1 relative">
                                <HTMLVideoVRPlayer 
                                    vrMode={previewVrMode} 
                                    setVrMode={setPreviewVrMode} 
                                    isMuted={previewIsMuted} 
                                    setIsMuted={setPreviewIsMuted} 
                                    onExit={() => {
                                        setPreviewMedia(null);
                                        setPreviewVrMode(false);
                                        setPreviewIsMuted(true);
                                    }} 
                                    videoUrl={previewMedia.url} 
                                />
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- MASTER PLAYER (Routing antara Video, Eco Room, dan Quiz Room) ---
        function MasterPlayer({ vrMode, setVrMode, isMuted, setIsMuted, onExit, broadcastData }) {
            if (broadcastData?.type === 'video' && broadcastData?.data?.url) {
                return <HTMLVideoVRPlayer vrMode={vrMode} setVrMode={setVrMode} isMuted={isMuted} setIsMuted={setIsMuted} onExit={onExit} videoUrl={broadcastData.data.url} />;
            } else if (broadcastData?.type === 'quiz' && broadcastData?.data) {
                return <Quiz3DRoom vrMode={vrMode} setVrMode={setVrMode} isMuted={isMuted} setIsMuted={setIsMuted} onExit={onExit} quizData={broadcastData.data} />;
            } else {
                return <Ecosystem3DRoom vrMode={vrMode} setVrMode={setVrMode} isMuted={isMuted} setIsMuted={setIsMuted} onExit={onExit} />;
            }
        }

        // --- 1. HTML5 VR PLAYER (Video) ---
        function HTMLVideoVRPlayer({ vrMode, setVrMode, isMuted, setIsMuted, onExit, videoUrl }) {
            const leftVideoRef = useRef(null);
            const rightVideoRef = useRef(null);
            const [isUiVisible, setIsUiVisible] = useState(true);

            // Auto-hide UI Logic
            useEffect(() => {
                let timeout;
                const resetTimer = () => {
                    setIsUiVisible(true);
                    clearTimeout(timeout);
                    if (document.fullscreenElement || document.webkitFullscreenElement || document.body.classList.contains('fallback-fullscreen')) {
                        timeout = setTimeout(() => setIsUiVisible(false), 3000);
                    }
                };
                window.addEventListener('mousemove', resetTimer); window.addEventListener('touchstart', resetTimer); window.addEventListener('click', resetTimer);
                resetTimer();
                return () => { window.removeEventListener('mousemove', resetTimer); window.removeEventListener('touchstart', resetTimer); window.removeEventListener('click', resetTimer); clearTimeout(timeout); };
            }, []);

            useEffect(() => {
                if (leftVideoRef.current) {
                    leftVideoRef.current.muted = isMuted;
                    if (rightVideoRef.current) rightVideoRef.current.muted = true; 
                    
                    const playVideos = async () => {
                        try {
                            const p = [leftVideoRef.current.play()];
                            if(rightVideoRef.current) p.push(rightVideoRef.current.play());
                            await Promise.all(p);
                        } catch (e) { console.log("Autoplay ditolak."); }
                    };
                    playVideos();
                }
            }, [videoUrl, isMuted, vrMode]);

            const syncVideos = () => {
                if (leftVideoRef.current && rightVideoRef.current) {
                    if (Math.abs(leftVideoRef.current.currentTime - rightVideoRef.current.currentTime) > 0.1) {
                        rightVideoRef.current.currentTime = leftVideoRef.current.currentTime;
                    }
                }
            };

            return (
                <div className="relative w-full h-full bg-black flex items-center justify-center overflow-hidden">
                    <div className="absolute inset-0 flex w-full h-full">
                        <div className={`vr-lens-container ${vrMode ? 'w-1/2 border-r-2 border-slate-900/50' : 'w-full'}`}>
                            <div className={vrMode ? 'vr-lens-mask' : 'w-full h-full relative'}>
                                <video ref={leftVideoRef} src={videoUrl} className={vrMode ? 'vr-video' : 'normal-video'} onTimeUpdate={syncVideos} playsInline loop crossOrigin="anonymous" />
                            </div>
                        </div>
                        {vrMode && (
                            <div className="vr-lens-container w-1/2 border-l-2 border-slate-900/50">
                                <div className="vr-lens-mask">
                                    <video ref={rightVideoRef} src={videoUrl} className="vr-video" playsInline muted loop crossOrigin="anonymous" />
                                </div>
                            </div>
                        )}
                    </div>
                    <ControlsOverlay onExit={onExit} vrMode={vrMode} setVrMode={setVrMode} isMuted={isMuted} setIsMuted={setIsMuted} isUiVisible={isUiVisible} />
                </div>
            );
        }

        // --- 2. RUANG KUIS 360 (Dengan Deteksi Gestur Kepala) ---
        function Quiz3DRoom({ vrMode, setVrMode, isMuted, setIsMuted, onExit, quizData }) {
            const containerRef = useRef(null);
            const [isUiVisible, setIsUiVisible] = useState(true);
            const [answerStatus, setAnswerStatus] = useState(''); // Feedback UI

            // Auto-hide UI Logic
            useEffect(() => {
                let timeout;
                const resetTimer = () => {
                    setIsUiVisible(true);
                    clearTimeout(timeout);
                    if (document.fullscreenElement || document.webkitFullscreenElement || document.body.classList.contains('fallback-fullscreen')) {
                        timeout = setTimeout(() => setIsUiVisible(false), 3000);
                    }
                };
                window.addEventListener('mousemove', resetTimer); window.addEventListener('touchstart', resetTimer); window.addEventListener('click', resetTimer);
                resetTimer();
                return () => { window.removeEventListener('mousemove', resetTimer); window.removeEventListener('touchstart', resetTimer); window.removeEventListener('click', resetTimer); clearTimeout(timeout); };
            }, []);

            useEffect(() => {
                if (!containerRef.current || !window.THREE) return;
                const THREE = window.THREE;
                const container = containerRef.current;
                
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x0a0a1a);

                const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
                camera.position.set(0, 0, 0);

                const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "low-power" });
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); 
                renderer.setSize(container.clientWidth, container.clientHeight);
                container.appendChild(renderer.domElement);

                let stereoEffect = null;
                if (vrMode && THREE.StereoEffect) {
                    stereoEffect = new THREE.StereoEffect(renderer);
                    stereoEffect.setSize(container.clientWidth, container.clientHeight);
                }

                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().catch(console.error);
                }

                // Bangun Latar 360 (Gambar yang diunggah atau Default Grid)
                if (quizData.bgUrl) {
                    const geometry = new THREE.SphereGeometry(500, 60, 40);
                    geometry.scale(-1, 1, 1);
                    const texture = new THREE.TextureLoader().load(quizData.bgUrl);
                    const material = new THREE.MeshBasicMaterial({ map: texture });
                    scene.add(new THREE.Mesh(geometry, material));
                } else {
                    const gridHelper = new THREE.GridHelper(300, 60, 0x0ea5e9, 0x0f172a);
                    gridHelper.position.y = -20;
                    scene.add(gridHelper);
                }

                // Sistem Kontrol
                let lon = -90, lat = 0; 
                let isDragging = false;
                let prev = { x:0, y:0 };
                const onDown = (e) => { isDragging = true; prev = { x: e.touches?.[0].clientX || e.clientX, y: e.touches?.[0].clientY || e.clientY }; };
                const onUp = () => isDragging = false;
                const onMove = (e) => {
                    if(!isDragging) return;
                    const x = e.touches?.[0].clientX || e.clientX, y = e.touches?.[0].clientY || e.clientY;
                    lon -= (x - prev.x) * 0.2; lat += (y - prev.y) * 0.2; lat = Math.max(-85, Math.min(85, lat));
                    prev = { x, y };
                };
                container.addEventListener('mousedown', onDown); window.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onUp);
                container.addEventListener('touchstart', onDown, {passive:false}); window.addEventListener('touchmove', onMove, {passive:false}); window.addEventListener('touchend', onUp);

                let controls = null;
                if (THREE.DeviceOrientationControls) {
                    controls = new THREE.DeviceOrientationControls(camera);
                }

                // --- ALGORITMA DETEKSI GESTUR KEPALA ---
                let lastGestureTime = Date.now();
                let gestureCounts = { right: 0, left: 0, up: 0, down: 0 };
                let gyroState = 'IDLE'; // IDLE, PEAK_R, PEAK_L, PEAK_U, PEAK_D
                let baseYaw = null;
                let basePitch = null;

                const detectGesture = () => {
                    // Ambil rotasi absolut kamera di ruang dunia
                    const euler = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
                    if (baseYaw === null) { baseYaw = euler.y; basePitch = euler.x; return; }

                    const yawDiff = euler.y - baseYaw;
                    const pitchDiff = euler.x - basePitch;

                    const threshold = 0.35; // Sekitar 20 derajat patahan
                    const resetThresh = 0.15; // Kembali ke pusat

                    // Reset hitungan jika lebih dari 2.5 detik tidak ada gerakan lanjutan
                    if (Date.now() - lastGestureTime > 2500) {
                        gestureCounts = { right: 0, left: 0, up: 0, down: 0 };
                        baseYaw = euler.y; // Auto kalibrasi ulang pusat
                        basePitch = euler.x;
                    }

                    // Deteksi Geleng (Yaw)
                    if (gestureState === 'IDLE') {
                        if (yawDiff < -threshold) gestureState = 'PEAK_R';
                        else if (yawDiff > threshold) gestureState = 'PEAK_L';
                        else if (pitchDiff > threshold) gestureState = 'PEAK_D'; // Nunduk/Angguk
                        else if (pitchDiff < -threshold) gestureState = 'PEAK_U'; // Dongak
                    }

                    // Hitung saat kepala kembali ke pusat
                    if (gestureState !== 'IDLE') {
                        if (Math.abs(yawDiff) < resetThresh && Math.abs(pitchDiff) < resetThresh) {
                            if (gestureState === 'PEAK_R') gestureCounts.right++;
                            if (gestureState === 'PEAK_L') gestureCounts.left++;
                            if (gestureState === 'PEAK_D') gestureCounts.down++;
                            if (gestureState === 'PEAK_U') gestureCounts.up++;
                            
                            gestureState = 'IDLE';
                            lastGestureTime = Date.now();

                            // Eksekusi Aksi jika mencapai 2x
                            if (gestureCounts.right >= 2) { setAnswerStatus('LANJUT KUIS >>'); gestureCounts.right = 0; setTimeout(()=>setAnswerStatus(''), 2000); }
                            if (gestureCounts.left >= 2) { setAnswerStatus('<< KEMBALI'); gestureCounts.left = 0; setTimeout(()=>setAnswerStatus(''), 2000); }
                            if (gestureCounts.down >= 2) { setAnswerStatus('JAWABAN: IYA / SETUJU'); gestureCounts.down = 0; setTimeout(()=>setAnswerStatus(''), 2000); }
                            if (gestureCounts.up >= 2) { setAnswerStatus('JAWABAN: TIDAK / MENOLAK'); gestureCounts.up = 0; setTimeout(()=>setAnswerStatus(''), 2000); }
                        }
                    }
                };

                let animationId;
                const animate = () => {
                    animationId = requestAnimationFrame(animate);

                    if (controls && controls.deviceOrientation && controls.deviceOrientation.alpha !== null) {
                        controls.update(); 
                    } else {
                        const phi = THREE.MathUtils.degToRad(90 - lat);
                        const theta = THREE.MathUtils.degToRad(lon);
                        camera.lookAt(100 * Math.sin(phi) * Math.cos(theta), 100 * Math.cos(phi), 100 * Math.sin(phi) * Math.sin(theta));
                    }

                    detectGesture(); // Jalankan deteksi gestur tiap frame

                    if (stereoEffect) stereoEffect.render(scene, camera);
                    else renderer.render(scene, camera);
                };
                animate();

                const onResize = () => {
                    const w = container.clientWidth; const h = container.clientHeight;
                    camera.aspect = w / h; camera.updateProjectionMatrix();
                    renderer.setSize(w, h);
                    if (stereoEffect) stereoEffect.setSize(w, h);
                };
                window.addEventListener('resize', onResize);

                return () => {
                    cancelAnimationFrame(animationId);
                    window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp);
                    window.removeEventListener('touchmove', onMove); window.removeEventListener('touchend', onUp);
                    window.removeEventListener('resize', onResize);
                    renderer.dispose();
                    if(controls) controls.dispose();
                    if(container.contains(renderer.domElement)) container.removeChild(renderer.domElement);
                };
            }, [vrMode, quizData]);

            return (
                <div className="relative w-full h-full bg-black">
                    <div ref={containerRef} className="absolute inset-0 cursor-move"></div>
                    {vrMode && <div className="absolute top-0 bottom-0 left-1/2 w-1 bg-black/80 z-10 shadow-[0_0_15px_rgba(0,0,0,1)]"></div>}
                    
                    {/* UI Kuis di atas Canvas 3D */}
                    <div className="absolute top-10 inset-x-0 z-20 flex flex-col items-center pointer-events-none">
                        <div className="bg-black/60 text-white px-8 py-4 rounded-3xl border border-cyan-500/50 shadow-[0_0_30px_rgba(6,182,212,0.4)] backdrop-blur-md max-w-2xl text-center mx-4">
                            <h2 className="text-xl md:text-3xl font-bold mb-2">{quizData?.question || "Pertanyaan Kuis?"}</h2>
                            <p className="text-cyan-300 text-xs md:text-sm font-medium">Angguk 2x (Iya) | Dongak 2x (Tidak) | Geleng Kanan 2x (Lanjut)</p>
                        </div>
                        {answerStatus && (
                            <div className="mt-8 bg-green-500/80 text-white px-8 py-3 rounded-full font-bold text-xl md:text-2xl animate-pulse shadow-lg backdrop-blur">
                                {answerStatus}
                            </div>
                        )}
                    </div>

                    <ControlsOverlay onExit={onExit} vrMode={vrMode} setVrMode={setVrMode} isMuted={isMuted} setIsMuted={setIsMuted} isUiVisible={isUiVisible} />
                </div>
            );
        }

        // --- 3. RUANG DEMO EKOSISTEM 360 (Three.js Murni) ---
        function Ecosystem3DRoom({ vrMode, setVrMode, isMuted, setIsMuted, onExit }) {
            const containerRef = useRef(null);
            const [isUiVisible, setIsUiVisible] = useState(true);

            useEffect(() => {
                let timeout;
                const resetTimer = () => {
                    setIsUiVisible(true);
                    clearTimeout(timeout);
                    if (document.fullscreenElement || document.webkitFullscreenElement || document.body.classList.contains('fallback-fullscreen')) {
                        timeout = setTimeout(() => setIsUiVisible(false), 3000);
                    }
                };
                window.addEventListener('mousemove', resetTimer); window.addEventListener('touchstart', resetTimer); window.addEventListener('click', resetTimer);
                resetTimer();
                return () => { window.removeEventListener('mousemove', resetTimer); window.removeEventListener('touchstart', resetTimer); window.removeEventListener('click', resetTimer); clearTimeout(timeout); };
            }, []);

            useEffect(() => {
                if (!containerRef.current || !window.THREE) return;
                const THREE = window.THREE;
                const container = containerRef.current;
                
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x020617); 
                scene.fog = new THREE.FogExp2(0x020617, 0.02);

                const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
                camera.position.set(0, 0, 0);

                const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "low-power" });
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); 
                renderer.setSize(container.clientWidth, container.clientHeight);
                container.appendChild(renderer.domElement);

                let stereoEffect = null;
                if (vrMode && THREE.StereoEffect) {
                    stereoEffect = new THREE.StereoEffect(renderer);
                    stereoEffect.setSize(container.clientWidth, container.clientHeight);
                }

                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().catch(console.error);
                }

                const gridHelper = new THREE.GridHelper(300, 60, 0x10b981, 0x064e3b);
                gridHelper.position.y = -15;
                scene.add(gridHelper);

                const starGeo = new THREE.BufferGeometry();
                const starVerts = [];
                for(let i=0; i<1500; i++) {
                    starVerts.push((Math.random()-0.5)*300, (Math.random()-0.5)*300, (Math.random()-0.5)*300);
                }
                starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVerts, 3));
                const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0x34d399, size: 0.8, transparent: true, opacity: 0.6}));
                scene.add(stars);

                const createIconSprite = (emoji, size, yPos) => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 256; canvas.height = 256;
                    const ctx = canvas.getContext('2d');
                    ctx.font = '120px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.shadowColor = '#10b981'; ctx.shadowBlur = 20; 
                    ctx.fillStyle = '#ffffff';
                    ctx.fillText(emoji, 128, 128);
                    
                    const tex = new THREE.CanvasTexture(canvas);
                    tex.needsUpdate = true;
                    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
                    sprite.scale.set(size, size, 1);
                    return sprite;
                };

                const icons = ['🦊', '🦅', '🐛', '🌳', '🌍', '☀️', '💧', '☁️'];
                const iconSprites = [];
                for(let i=0; i<60; i++) {
                    const icon = icons[Math.floor(Math.random() * icons.length)];
                    const angle = Math.random() * Math.PI * 2;
                    const radius = 40 + Math.random() * 60;
                    const x = Math.cos(angle) * radius;
                    const z = Math.sin(angle) * radius;
                    const yPos = (icon === '🦅' || icon === '☀️' || icon === '☁️') ? 15 + Math.random()*20 : (icon === '🐛' || icon === '🌳') ? -10 : 5;
                    const sprite = createIconSprite(icon, 15, yPos);
                    sprite.position.set(x, yPos, z);
                    scene.add(sprite);
                    iconSprites.push(sprite);
                }

                const textCanvas = document.createElement('canvas');
                textCanvas.width = 2048; textCanvas.height = 512;
                const ctx = textCanvas.getContext('2d');
                ctx.fillStyle = 'rgba(0,0,0,0)'; ctx.fillRect(0,0,2048,512);
                ctx.textAlign = 'center';
                ctx.font = 'bold 80px "Inter", sans-serif'; ctx.fillStyle = '#6ee7b7';
                ctx.fillText('Selamat Datang, di ruang Virtual,', 1024, 200);
                ctx.font = '900 150px "Inter", sans-serif'; ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#10b981'; ctx.shadowBlur = 20;
                ctx.fillText('CAKRA-SAINS', 1024, 380);
                const textTex = new THREE.CanvasTexture(textCanvas);
                textTex.needsUpdate = true;
                const textSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: textTex, transparent: true }));
                textSprite.scale.set(160, 40, 1); 
                textSprite.position.set(0, 10, -60); 
                scene.add(textSprite);

                let lon = -90, lat = 0; 
                let isDragging = false;
                let prev = { x:0, y:0 };
                const onDown = (e) => { isDragging = true; prev = { x: e.touches?.[0].clientX || e.clientX, y: e.touches?.[0].clientY || e.clientY }; };
                const onUp = () => isDragging = false;
                const onMove = (e) => {
                    if(!isDragging) return;
                    const x = e.touches?.[0].clientX || e.clientX, y = e.touches?.[0].clientY || e.clientY;
                    lon -= (x - prev.x) * 0.2; lat += (y - prev.y) * 0.2; lat = Math.max(-85, Math.min(85, lat));
                    prev = { x, y };
                };
                container.addEventListener('mousedown', onDown); window.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onUp);
                container.addEventListener('touchstart', onDown, {passive:false}); window.addEventListener('touchmove', onMove, {passive:false}); window.addEventListener('touchend', onUp);

                let controls = null;
                if (THREE.DeviceOrientationControls) {
                    controls = new THREE.DeviceOrientationControls(camera);
                }

                let animationId;
                const animate = () => {
                    animationId = requestAnimationFrame(animate);
                    const time = Date.now() * 0.001;
                    iconSprites.forEach((sprite, i) => { sprite.position.y += Math.sin(time + i) * 0.02; });
                    textSprite.position.y = 10 + Math.sin(time * 2) * 1.5;

                    if (controls && controls.deviceOrientation && controls.deviceOrientation.alpha !== null) {
                        controls.update(); 
                    } else {
                        const phi = THREE.MathUtils.degToRad(90 - lat);
                        const theta = THREE.MathUtils.degToRad(lon);
                        camera.lookAt(100 * Math.sin(phi) * Math.cos(theta), 100 * Math.cos(phi), 100 * Math.sin(phi) * Math.sin(theta));
                    }
                    if (stereoEffect) stereoEffect.render(scene, camera);
                    else renderer.render(scene, camera);
                };
                animate();

                const onResize = () => {
                    const w = container.clientWidth; const h = container.clientHeight;
                    camera.aspect = w / h; camera.updateProjectionMatrix();
                    renderer.setSize(w, h);
                    if (stereoEffect) stereoEffect.setSize(w, h);
                };
                window.addEventListener('resize', onResize);

                return () => {
                    cancelAnimationFrame(animationId);
                    window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp);
                    window.removeEventListener('touchmove', onMove); window.removeEventListener('touchend', onUp);
                    window.removeEventListener('resize', onResize);
                    renderer.dispose();
                    if(controls) controls.dispose();
                    if(container.contains(renderer.domElement)) container.removeChild(renderer.domElement);
                };
            }, [vrMode]);

            return (
                <div className="relative w-full h-full bg-black">
                    <div ref={containerRef} className="absolute inset-0 cursor-move"></div>
                    {vrMode && <div className="absolute top-0 bottom-0 left-1/2 w-1 bg-black/80 z-10 shadow-[0_0_15px_rgba(0,0,0,1)]"></div>}
                    
                    <div className={`absolute top-10 left-1/2 -translate-x-1/2 z-20 pointer-events-none transition-opacity duration-500 ${isUiVisible ? 'opacity-100' : 'opacity-0'}`}>
                        <div className="bg-black/50 text-white px-6 py-2 rounded-full border border-white/10 text-xs md:text-sm font-bold animate-pulse backdrop-blur whitespace-nowrap">
                            Menunggu Siaran Film dari Guru... (Putar HP Anda)
                        </div>
                    </div>

                    <ControlsOverlay onExit={onExit} vrMode={vrMode} setVrMode={setVrMode} isMuted={isMuted} setIsMuted={setIsMuted} isUiVisible={isUiVisible} />
                </div>
            );
        }

        // --- KOMPONEN TOMBOL BAWAH ---
        function ControlsOverlay({ onExit, vrMode, setVrMode, isMuted, setIsMuted, isUiVisible = true, isPreview = false }) {
            
            // Fullscreen Handler yang diperkuat untuk WebKit (iOS/Android)
            const handleFullscreen = () => {
                const elem = document.documentElement;
                const isFullscreenNow = document.fullscreenElement || document.webkitFullscreenElement || document.body.classList.contains('fallback-fullscreen');
                
                if (!isFullscreenNow) {
                    if (elem.requestFullscreen) {
                        elem.requestFullscreen().catch(() => document.body.classList.add('fallback-fullscreen'));
                    } else if (elem.webkitRequestFullscreen) {
                        elem.webkitRequestFullscreen();
                        // Paksa fallback jika webkit gagal
                        setTimeout(() => { if(!document.webkitFullscreenElement) document.body.classList.add('fallback-fullscreen'); }, 500);
                    } else {
                        document.body.classList.add('fallback-fullscreen');
                    }
                } else {
                    document.body.classList.remove('fallback-fullscreen');
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                }
            };

            return (
                <div className={`absolute inset-x-0 bottom-0 p-6 flex justify-between items-end z-[99999] pointer-events-none transition-opacity duration-500 ${isUiVisible ? 'opacity-100' : 'opacity-0'}`}>
                    <button onClick={() => { document.body.classList.remove('fallback-fullscreen'); onExit(); }} className={`px-5 py-3 backdrop-blur text-white rounded-2xl font-bold shadow-lg border transition-colors pointer-events-auto text-sm md:text-base ${isPreview ? 'bg-red-600/80 hover:bg-red-500 border-red-400/30' : 'bg-red-600/80 hover:bg-red-500 border-red-400/30'}`}>
                        {isPreview ? '✕ Tutup Pratinjau' : '✕ Keluar'}
                    </button>
                    
                    <div className="flex gap-3 pointer-events-auto">
                        <button onClick={() => setIsMuted(!isMuted)} className={`w-12 h-12 md:w-14 md:h-14 rounded-2xl flex items-center justify-center backdrop-blur transition-all shadow-lg border text-white ${isMuted ? 'bg-red-600 border-red-500' : 'bg-blue-600 border-blue-400'}`}>
                            {isMuted ? <IconVolumeOff /> : <IconVolumeUp />}
                        </button>
                        <button onClick={() => setVrMode(!vrMode)} className={`w-12 h-12 md:w-14 md:h-14 rounded-2xl flex items-center justify-center backdrop-blur transition-all shadow-lg border ${vrMode ? 'bg-cyan-600 text-white border-cyan-400' : 'bg-black/50 border-white/20 text-slate-300 hover:bg-white/10'}`}>
                            <IconVR />
                        </button>
                        <button onClick={handleFullscreen} className="w-12 h-12 md:w-14 md:h-14 rounded-2xl flex items-center justify-center backdrop-blur transition-all shadow-lg border bg-black/50 border-white/20 text-slate-300 hover:bg-white/10">
                            <IconFullscreen />
                        </button>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<CakraSainsApp />, document.getElementById('root'));
    </script>
</body>
</html>
